<html>
  <head>
    <title>Мой первый API клиент</title>
  </head>
  
  <body>
    <h1>Информация о покемоне из Облака</h1>
    <button id="loadBtn">Загрузить данные через API</button>
    <ul id="userList"></ul>
    
<script>
const button = document.getElementById('loadBtn');
const list = document.getElementById('userList');

async function loadData() {
  try {
    const response = await fetch('https://pokeapi.co/api/v2/pokemon/pikachu'); 

    if (!response.ok) {
      throw new Error(`Ошибка при загрузке данных (${response.status})`);
    }

   
    const data = await response.json();

    list.innerHTML = '';


    const liName = document.createElement('li');
    const liWeight = document.createElement('li');


    liName.innerText = `Имя: ${data.name}`;
    liWeight.innerText = `Вес: ${data.weight} кг`;
    liWeight.innerText = `Вес: ${(data.weight / 1000).toFixed(1)} кг`;

    list.appendChild(liName);
    list.appendChild(liWeight);

    button.innerText = 'Данные загружены!';
  } catch (error) {

    console.error(error.message);
    alert('Не удалось загрузить информацию о покемоне.');
  }
}

button.addEventListener('click', loadData);
</script>

  </body>
</html>
